<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My account | Personality Discovery</title><link rel="stylesheet" href="/css/style.css"></head><body><header><a href="/">✦ Personality Discovery</a><a href="/test.html">Take the test</a></header><main class="report-main" style="max-width:540px"><section class="card" id="auth"><h1 id="heading">Create your account</h1><p>Create an account to save your personality report and access it after payment.</p><form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><p class="small">Use at least 8 characters.</p><button id="submit" type="submit">Create account</button></form><p><button type="button" class="secondary" id="toggle">Already have an account? Log in</button></p><p class="error" id="error" role="alert"></p></section><section class="card" id="dashboard" hidden><h1>My account</h1><p id="identity"></p><h2>Your assessments</h2><div id="reports"></div><p><a href="/test.html">Take a new test</a></p><button id="logout">Log out</button></section></main><script src="/js/account.js" defer></script></body></html>
